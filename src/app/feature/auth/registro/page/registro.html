<div class="flex align-items-center justify-content-center min-h-screen p-3">
  <div class="w-full" style="max-width: 30rem">
    <p-card header="Crear cuenta">
      <form class="flex flex-column gap-3" [formGroup]="formulario" (ngSubmit)="crearCuenta()">
        @if (mensaje()) {
          <p-message severity="error" [text]="mensaje()" styleClass="w-full" />
        }

        <div class="flex flex-column gap-2">
          <label for="nombreUsuario">Nombre de usuario</label>
          <input pInputText id="nombreUsuario" formControlName="nombreUsuario" class="w-full" />
        </div>

        <div class="flex flex-column gap-2">
          <label for="nombreCompleto">Nombre completo</label>
          <input pInputText id="nombreCompleto" formControlName="nombreCompleto" class="w-full" />
        </div>

        <div class="flex flex-column gap-2">
          <label for="correo">Correo</label>
          <input pInputText id="correo" type="email" formControlName="correo" class="w-full" autocomplete="email" />
        </div>

        <div class="flex flex-column gap-2">
          <label for="contrasena">Contraseña</label>
          <p-password
            inputId="contrasena"
            formControlName="contrasena"
            [feedback]="false"
            [toggleMask]="true"
            styleClass="w-full"
            inputStyleClass="w-full"
            autocomplete="new-password"
          />
        </div>

        <div class="flex flex-column gap-2">
          <label for="fechaNacimiento">Fecha de nacimiento</label>
          <p-datepicker
            inputId="fechaNacimiento"
            formControlName="fechaNacimiento"
            dateFormat="dd/mm/yy"
            [showIcon]="true"
            styleClass="w-full"
            inputStyleClass="w-full"
          />
        </div>

        <div class="flex flex-column gap-2">
          <label for="politicaId">Id de la política aceptada</label>
          <input pInputText id="politicaId" type="number" formControlName="politicaId" class="w-full" />
        </div>

        <p-button
          type="submit"
          label="Crear cuenta"
          styleClass="w-full"
          [loading]="cargando()"
          [disabled]="formulario.invalid || cargando()"
        />
      </form>

      <p class="mt-3 mb-0">
        ¿Ya tienes cuenta?
        <a routerLink="/login">Inicia sesión</a>
      </p>
    </p-card>
  </div>
</div>
